# Ralph Routing Configuration
#
# Centralized routing logic for the simplified Ralph v1 architecture:
#   - Tasks use LANE + TIER annotations (no per-task model names)
#   - orchestrator.sh selects the engine: lane -> engine
#   - ralph.sh resolves the model: [engine + tier] -> model
#   - Exactly one engine runs per execution; at most one fallback per task
#
# This file is `source`d by both orchestrator.sh and ralph.sh. Keep it as
# plain shell variable assignments only (no commands, no side effects).

# ============================================================================
# STAGE DEFAULTS
# ============================================================================
# Used when a stage needs an engine/tier but the task/plan does not specify one
# (e.g. plan and decompose stages operate on the plan as a whole, not a task).

PLAN_ENGINE_DEFAULT="claude"
PLAN_TIER_DEFAULT="Moderate"

DECOMPOSE_ENGINE_DEFAULT="claude"
DECOMPOSE_TIER_DEFAULT="Moderate"

BUILD_ENGINE_DEFAULT="codex"
BUILD_TIER_DEFAULT="Moderate"

# ============================================================================
# LANE -> ENGINE
# ============================================================================
# Supported lanes: ARCH, BUILD, VERIFY, GUI, SCAFFOLD
# Each lane maps to exactly one primary engine.

LANE_ARCH_ENGINE="claude"
LANE_BUILD_ENGINE="codex"
LANE_VERIFY_ENGINE="claude"
LANE_GUI_ENGINE="codex"
LANE_SCAFFOLD_ENGINE="claude"

# ============================================================================
# LANE -> FALLBACK ENGINE
# ============================================================================
# If the primary engine for a lane lacks capacity, orchestrator.sh switches
# to the fallback engine ONCE. No chained / recursive fallback.

LANE_ARCH_FALLBACK="codex"
LANE_BUILD_FALLBACK="claude"
LANE_VERIFY_FALLBACK="codex"
LANE_GUI_FALLBACK="claude"
LANE_SCAFFOLD_FALLBACK="codex"

# ============================================================================
# [ENGINE + TIER] -> MODEL
# ============================================================================
# Supported tiers: Simple, Moderate, Complex
# Resolution: MODEL_${engine}_${tier} -> model-id
#
# Claude uses tier-alias model names (haiku/sonnet/opus) accepted by the
# Claude CLI. Codex and Gemini use provider-qualified model IDs.

MODEL_claude_Simple="haiku"
MODEL_claude_Moderate="sonnet"
MODEL_claude_Complex="opus"

MODEL_codex_Simple="gpt-5.4-mini"
MODEL_codex_Moderate="gpt-5.4"
MODEL_codex_Complex="gpt-5.3-codex"

MODEL_gemini_Simple="gemini-3-flash"
MODEL_gemini_Moderate="gemini-3.1-pro-preview"
MODEL_gemini_Complex="gemini-3.1-pro-preview"
